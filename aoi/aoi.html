<title>혁신의 시대 · 셋업 랜더마이저</title>
<style>
  :root{
    --bg:#f3e9d2; --panel:#fffaf0; --ink:#3a2c1a; --line:#d8c7a4;

  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
       background:var(--bg);color:var(--ink);}
  header{background:linear-gradient(180deg,#6b4a26,#4d3318);color:#f6ead0;
         padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
         position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  header h1{font-size:20px;margin:0;letter-spacing:1px;flex:1 1 auto}
  header h1 small{font-weight:400;opacity:.8;font-size:13px;display:block}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pcount label{font-size:13px;margin-right:4px}
  .ext{display:inline-flex;gap:10px;background:#5c3f20;border-radius:8px;padding:6px 10px}
  .ext label{font-size:13px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
  .ext input{accent-color:var(--gold)}
  .ext-badge{display:inline-block;background:#7a4dd0;color:#fff;font-size:10px;font-weight:700;
        border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle}
  select,button{font-family:inherit;font-size:14px;border-radius:8px;
        border:1px solid var(--line);padding:8px 12px;cursor:pointer}
  button.primary{background:var(--gold);color:#2a1f0c;border:none;font-weight:700}
  button.ghost,.ghost{background:#fffaf0;color:#4d3318}
  .backbtn{font-family:inherit;font-size:14px;font-weight:700;line-height:1;
        border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;
        text-decoration:none;display:inline-flex;align-items:center}
  .backbtn:hover{background:#f3e7cf}
  button:active,.backbtn:active{transform:translateY(1px)}
  main{max-width:1180px;margin:0 auto;padding:18px;
       display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card.wide{grid-column:1 / -1}
  .card h2{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
  .card h2 .n{background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;
        display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
  .hint{font-size:12px;color:#8a7654;margin:0 0 10px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .tile{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;
        font-size:13px;line-height:1.35;min-width:0}
  .tile .t{font-weight:700}
  .tile .s{font-size:12px;color:#6f5b3a}
  .pill{display:inline-block;font-size:11px;font-weight:700;color:#fff;
        border-radius:20px;padding:2px 9px;white-space:nowrap}
  .b-bank{background:var(--disc-bank)} .b-law{background:var(--disc-law)}
  .b-eng{background:var(--disc-eng)} .b-med{background:var(--disc-med)}
  /* round score ladder */
  .ladder{display:flex;flex-direction:column-reverse;gap:6px}
  .rnd{display:flex;align-items:stretch;gap:10px;border:1px solid var(--line);
       border-radius:9px;overflow:hidden;background:#fff}
  .rnd .num{background:var(--accent);color:#fff;width:60px;flex:0 0 60px;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-weight:700;font-size:13px;text-align:center;padding:4px}
  .rnd .num b{font-size:18px}
  .rnd .body{flex:1;padding:8px 10px;display:flex;flex-wrap:wrap;
       align-items:center;gap:8px;justify-content:space-between}
  .rnd .act{font-size:13px}
  .rnd.final .num{background:#7a1f1f}
  .rnd .finaltag{font-size:11px;color:#7a1f1f;font-weight:700}
  /* faction sets */
  .sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .set{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .set .terr{padding:6px 10px;color:#fff;font-weight:700;font-size:13px;
       display:flex;justify-content:space-between;align-items:center}
  .set .inner{padding:8px 10px;font-size:13px}
  .set .inner .lbl{font-size:11px;color:#8a7654}
  .set .inner .fac{font-weight:700;font-size:14px;margin-bottom:6px}
  .leftover{font-size:12.5px;color:#6f5b3a;margin-top:10px}
  .leftover b{color:var(--ink)}
  .grid12{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grid12 .tile{display:flex;align-items:flex-start;gap:6px}
  .seq{display:flex;flex-wrap:wrap;gap:6px}
  .seq .tile{display:flex;align-items:center;gap:6px}
  .seq .ix{background:#eadfc4;border-radius:6px;font-size:11px;font-weight:700;
        padding:1px 6px;color:#6b4a26}
  footer{max-width:1180px;margin:0 auto;padding:6px 18px 30px;font-size:12px;color:#8a7654}
  @media(max-width:760px){ main{grid-template-columns:1fr} header h1{font-size:17px}
        .grid12{grid-template-columns:repeat(2,1fr)} }
</style>
</head>

/* ===================== 유틸 ===================== */
const rint = n => Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rint(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick = (a,n) => shuffle(a).slice(0,n);

/* ===================== 라운드 점수 타일 셋업 ===================== */
// 12개 중 6개 선택 + 라운드6→1 배치, 제약:
//  - 특수 타일(#8)은 라운드5·6 칸 금지
//  - 같은 학문 3개를 라운드1~5에 모두 두기 금지(=그 학문 타일이 라운드6에 와야 함)
function setupRoundScore(){
  for(let tries=0; tries<2000; tries++){
    const chosen = pick(ROUND_SCORE, 6);     // rounds[0]=R1 ... [5]=R6
    // 같은 학문이 3개 모두 선택됐는지 확인
    const cnt = {};
    chosen.forEach(t=>cnt[t.disc]=(cnt[t.disc]||0)+1);
    const fullDiscs = Object.keys(cnt).filter(d=>cnt[d]===3);
    if(fullDiscs.length>=2) continue;          // 두 학문이 동시에 3개면 불가 → 재선정
    const order = shuffle(chosen);
    // 제약 검사
    const r5=order[4], r6=order[5];
    if(r5.special || r6.special) continue;     // #8은 5·6칸 금지
    if(fullDiscs.length===1 && r6.disc!==fullDiscs[0]) continue; // 3개학문은 R6에 1개
    return order; // [R1..R6]
  }
  return pick(ROUND_SCORE,6);
}
function setupFinal(r6tile){
  const cands = FINAL_SCORE.filter(f=>f.building!==r6tile.building);
  return cands[rint(cands.length)];
}

/* ===================== 종족 / 라운드 보너스(패스) 분배 ===================== */
// 숙련자(드래프트): 종족 인원수+1, 라운드 보너스 인원수+3 을 따로 공개
function setupFactions(players, pool){ return pick(pool, players+1); }
function setupRoundBonus(players, pool){ return pick(pool, players+3); }

/* ===================== 궁전 타일 (숙련자: #17 미사용) ===================== */
// pool 중 (인원수+1)개 무작위. 빨간 뒷면 #17은 사용하지 않음.
function setupPalace(players, pool){
  const chosen = pick(pool, players+1).sort((a,b)=>a-b);
  return {chosen};
}

/* ===================== 지형(기획 보드) ===================== */
// 7개를 섞어 6개 사용, 1개는 사용 불가
function setupTerrains(){
  const s = shuffle(TERRAINS);
  return {used:s.slice(0,6), unavail:s[6]};
}

/* ===================== 렌더 ===================== */
let LAST = null;
// 확장: 특수 부속(미래주의자 타일, 리벨라스 숙련도, 흰 다리 등) 안내
function noteHtml(items){
  const notes = items.filter(x=>x.special).map(x=>`${x.ko} → ${x.special}`);
  if(!notes.length) return '';
  return `<p class="leftover">🧩 확장 전용 부속: ${notes.join(' · ')}</p>`;
}
function generate(){
  const players = +document.getElementById('players').value;
  const ext = document.querySelector('input[name="ext"]:checked').value === 'ext';
  // 풀 구성 (확장 시 추가 구성요소 혼합)
  const facPool   = ext ? FACTIONS.concat(FACTIONS_EXT)         : FACTIONS;
  const innoPool  = ext ? INNOVATION.concat(INNOVATION_EXT)     : INNOVATION;
  const palacePool= ext ? Array.from({length:16},(_,i)=>i+1).concat(PALACE_EXT_IDS)
                        : Array.from({length:16},(_,i)=>i+1);
  const rbPool    = ext ? ROUND_BONUS.concat(ROUND_BONUS_EXT)   : ROUND_BONUS;
  const bookPool  = ext ? BOOK_ACTIONS.concat(BOOK_ACTIONS_EXT) : BOOK_ACTIONS;
  const compPool  = ext ? COMPETENCY.concat(COMPETENCY_EXT)     : COMPETENCY; // 17 vs 12
  const rs = setupRoundScore();
  const innovN = players*2 + 2;            // 2인6 3인8 4인10 5인12
  const data = {
    players, ext, compTotal: compPool.length,
    innovN,
    palace: setupPalace(players, palacePool),
    roundScore: rs,
    finalScore: setupFinal(rs[5]),
    bookActions: pick(bookPool, 3),
    competency: shuffle(compPool).slice(0, 12),  // 17개 중 12개 사용(확장), 5개 제외
    innovation: shuffle(innoPool).slice(0, innovN),
    terrains: setupTerrains(),
    factions: setupFactions(players, facPool),
    roundBonus: setupRoundBonus(players, rbPool),
  };
  LAST = data;
  render(data);
}

function render(d){
  const out = document.getElementById('out');
  const T = DISC;
  const discLabel = disc => `<span class="pill ${T[disc].cls}">${T[disc].ko}</span>`;

  // 1) 궁전
  const palaceHtml = `
   <div class="card" id="c-palace">
     <h2><span class="n">1</span>궁전(Palace) 타일</h2>
     <p class="hint">숙련자 셋업: ${d.ext?'1~16 + 확장 18~20번':'1~16번'} 중 무작위 ${d.players+1}개 (인원 ${d.players}+1). 빨간 뒷면 #17은 사용하지 않음.</p>
     <div class="row">
       ${d.palace.chosen.map(n=>`<div class="tile"><span class="t">#${n}</span>${n>=18?'<span class="ext-badge">확장</span>':''}</div>`).join('')}
     </div>
   </div>`;

  // 2) 라운드 점수 + 최종
  const rndHtml = `
   <div class="card wide" id="c-round">
     <h2><span class="n">2</span>라운드 점수 타일 (라운드 1→6)</h2>
     <p class="hint">12개 중 6개 선택 · 좌측=점수 획득 / 우측=학문 보너스. 라운드6에는 최종 점수 타일이 덮임.</p>
     <div class="ladder">
       ${d.roundScore.map((t,i)=>{
         const rn=i+1;
         const isR6 = rn===6;
         return `<div class="rnd ${isR6?'final':''}">
           <div class="num"><span>라운드</span><b>${rn}</b></div>
           <div class="body">
             <span class="act">${t.act}${t.special?' <span class="finaltag">※특수</span>':''}</span>
             <span>${discLabel(t.disc)} 보너스</span>
           </div>
         </div>`;
       }).join('')}
     </div>
     <div class="rnd final" style="margin-top:8px">
       <div class="num" style="background:#caa12e;color:#2a1f0c"><span>최종</span><b>R6</b></div>
       <div class="body">
         <span class="act"><b>최종 점수 타일:</b> ${BUILD[d.finalScore.building]} — ${d.finalScore.act}</span>
         <span class="finaltag">라운드6 건물(${d.roundScore[5].building?BUILD[d.roundScore[5].building]:'없음'})과 다름 ✔</span>
       </div>
     </div>
   </div>`;

  // 3) 책 행동
  const bookHtml = `
   <div class="card" id="c-book">
     <h2><span class="n">3</span>책 행동(Book Action) 타일</h2>
     <p class="hint">${d.ext?'9':'6'}개 중 무작위 3개를 보드의 책 행동 칸에 배치</p>
     <div class="row" style="flex-direction:column">
       ${d.bookActions.map(b=>`<div class="tile"><span class="t">${b.t}</span>${b.ext?'<span class="ext-badge">확장</span>':''}<br><span class="s">${b.s}</span></div>`).join('')}
     </div>
   </div>`;

  // 4) 숙련도
  const compHtml = `
   <div class="card" id="c-comp">
     <h2><span class="n">4</span>숙련도(Competency) 타일 배치</h2>
     <p class="hint">${d.ext?`17개 중 무작위 12개 사용(5개는 상자로). `:''}12개를 섞어 혁신 디스플레이 하단 칸에 배치 (좌→우, 위→아래 순서)</p>
     <div class="grid12">
       ${d.competency.map((c,i)=>`<div class="tile"><span class="ix">${i+1}</span> ${c.t}${c.ext?'<span class="ext-badge">확장</span>':''}</div>`).join('')}
     </div>
   </div>`;

  // 5) 혁신
  const innoHtml = `
   <div class="card wide" id="c-inno">
     <h2><span class="n">5</span>혁신(Innovation) 타일</h2>
     <p class="hint">${d.ext?'21':'18'}개 중 무작위 ${d.innovN}개를 혁신 디스플레이에 공개 (인원 ${d.players}인). 나머지는 상자로.</p>
     <div class="seq">
       ${d.innovation.map((t,i)=>`<div class="tile"><span class="ix">${i+1}</span> <span class="t">${t.ko}</span> <span class="s">(${t.n} · ${t.grp})</span>${t.ext?'<span class="ext-badge">확장</span>':''}</div>`).join('')}
     </div>
     ${noteHtml(d.innovation)}
   </div>`;

  // 6) 지형(기획 보드) — 7개 중 6개 사용, 1개 미사용
  const terrHtml = `
   <div class="card" id="c-terr">
     <h2><span class="n">6</span>기획 보드(지형)</h2>
     <p class="hint">7개를 섞어 6개를 공개(드래프트용). 1개는 사용하지 않음.</p>
     <div class="row">
       ${d.terrains.used.map(t=>`
         <div class="tile" style="border-left:6px solid ${t.color}">
           <span class="t">${t.ko}</span> <span class="s">${t.en}</span>
         </div>`).join('')}
       <div class="tile" style="opacity:.5;border-left:6px solid ${d.terrains.unavail.color};text-decoration:line-through">
         <span class="t">${d.terrains.unavail.ko}</span> <span class="s">미사용</span>
       </div>
     </div>
   </div>`;

  // 7) 종족 — 인원수+1
  const facHtml = `
   <div class="card" id="c-fac">
     <h2><span class="n">7</span>종족(Faction)</h2>
     <p class="hint">${d.ext?'18':'12'}개 중 무작위 ${d.players+1}개 공개 (인원 ${d.players}+1). 드래프트로 한 명씩 선택.</p>
     <div class="row" style="flex-direction:column">
       ${d.factions.map(f=>`<div class="tile"><span class="t">${f.ko}</span> <span class="s">(${f.n})</span>${f.ext?'<span class="ext-badge">확장</span>':''}</div>`).join('')}
     </div>
     ${noteHtml(d.factions)}
   </div>`;

  // 8) 라운드 보너스(패스) 타일 — 인원수+3
  const rbHtml = `
   <div class="card wide" id="c-rb">
     <h2><span class="n">8</span>라운드 보너스 / 패스 타일</h2>
     <p class="hint">${d.ext?'13':'10'}개 중 무작위 ${d.players+3}개 공개 (인원 ${d.players}+3). 드래프트 후 남는 3개는 보드 옆에 코인 1개씩 올림.</p>
     <div class="seq">
       ${d.roundBonus.map((r,i)=>`<div class="tile"><span class="ix">${i+1}</span> ${r.t}${r.ext?'<span class="ext-badge">확장</span>':''}</div>`).join('')}
     </div>
   </div>`;

  out.innerHTML = palaceHtml + rndHtml + bookHtml + compHtml + innoHtml + terrHtml + facHtml + rbHtml;
}

/* 결과 텍스트 복사 */
function toText(d){
  if(!d) return '';
  const L=[];
  L.push(`■ 혁신의 시대 숙련자 셋업 (${d.players}인${d.ext?' · 확장 포함':''})`);
  L.push(`· 궁전(${d.players+1}개, #17 미사용): ${d.palace.chosen.map(n=>'#'+n).join(', ')}`);
  L.push(`· 라운드 점수(1→6):`);
  d.roundScore.forEach((t,i)=>L.push(`   R${i+1}: ${t.act} / ${DISC[t.disc].ko}${t.special?' (특수)':''}`));
  L.push(`   최종: ${BUILD[d.finalScore.building]} (${d.finalScore.act})`);
  L.push(`· 책 행동(3): ${d.bookActions.map(b=>b.t).join(' | ')}`);
  L.push(`· 숙련도 배치: ${d.competency.map((c,i)=>(i+1)+'.'+c.t).join(' / ')}`);
  L.push(`· 혁신(${d.innovN}개 공개): ${d.innovation.map(t=>t.ko).join(', ')}`);
  L.push(`· 지형(6개 사용): ${d.terrains.used.map(t=>t.ko).join(', ')}  / 미사용: ${d.terrains.unavail.ko}`);
  L.push(`· 종족(${d.players+1}개): ${d.factions.map(f=>f.ko).join(', ')}`);
  L.push(`· 라운드 보너스/패스(${d.players+3}개): ${d.roundBonus.map((r,i)=>(i+1)+'.'+r.t).join(' / ')}`);
  return L.join('\n');
}

document.getElementById('rollBtn').addEventListener('click', generate);
document.getElementById('players').addEventListener('change', generate);
document.querySelectorAll('input[name="ext"]').forEach(r=>r.addEventListener('change', generate));

generate();
</script>
</body>
</html>
