<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보드게임 셋업 랜더마이저</title>
<style>
  :root{
    --bg:#1c2230; --bg2:#232b3d; --ink:#e9eef7; --muted:#9aa6bd;
    --card:#2b3346; --line:#3a445c; --accent:#caa12e;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
       color:#e9eef7;background:radial-gradient(1200px 600px at 50% -10%,#2a3450,#1c2230);}
  header{text-align:center;padding:48px 20px 12px}
  header h1{margin:0;font-size:30px;letter-spacing:1px}
  header p{margin:8px 0 0;color:#9aa6bd;font-size:15px}
  main{max-width:980px;margin:0 auto;padding:24px 20px 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .game{display:block;text-decoration:none;color:inherit;background:#2b3346;
        border:1px solid #3a445c;border-radius:16px;overflow:hidden;
        transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
  .game:hover{transform:translateY(-4px);border-color:#caa12e;
        box-shadow:0 10px 28px rgba(0,0,0,.4)}
  .game .thumb{height:130px;display:flex;align-items:center;justify-content:center;
        font-size:52px;background:linear-gradient(135deg,#6b4a26,#caa12e)}
  .game .body{padding:16px 18px}
  .game .body h2{margin:0;font-size:19px}
  .game .body p{margin:6px 0 0;color:#9aa6bd;font-size:13.5px;line-height:1.45}
  .game .tag{display:inline-block;margin-top:12px;font-size:12px;font-weight:700;
        color:#caa12e;border:1px solid #caa12e;border-radius:20px;padding:3px 12px}
  .game.soon{cursor:default;opacity:.55}
  .game.soon:hover{transform:none;border-color:#3a445c;box-shadow:none}
  .game.soon .thumb{background:linear-gradient(135deg,#3a445c,#4a5570);filter:grayscale(.3)}
  .game.soon .tag{color:#9aa6bd;border-color:#4a5570}
  footer{text-align:center;color:#6b748c;font-size:12px;padding:0 20px 40px}
</style>
</head>
<body>
<header>
  <h1>🎲 보드게임 셋업 랜더마이저</h1>
  <p>플레이할 게임을 선택하세요</p>
</header>

<main>
  <div class="grid">

    <a class="game" href="aoi/aoi.html">
      <div class="thumb">⚙️</div>
      <div class="body">
        <h2>혁신의 시대</h2>
        <p>Age of Innovation — 라운드 점수·혁신·궁전·종족 등 셋업을 규칙대로 랜덤 생성. 기본판 / 확장(Future &amp; Past) 지원.</p>
        <span class="tag">시작하기 →</span>
      </div>
    </a>

    <div class="game soon">
      <div class="thumb">➕</div>
      <div class="body">
        <h2>다음 게임</h2>
        <p>새로운 보드게임 랜더마이저가 여기에 추가될 예정이에요.</p>
        <span class="tag">준비 중</span>
      </div>
    </div>

  </div>
</main>

<footer>보드게임 셋업 랜더마이저 모음</footer>
</body>
</html>
